# Netlify: builds the static SPA from frontend/ on every push to main.
# The site must be served from injaz.jab-eri.org (same site as injaz-api.jab-eri.org) so the browser sends the
# SameSite refresh cookie; a *.netlify.app address would sign people out on every reload.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".output/public"
  # Skip the build when nothing under frontend/ changed (paths are relative to base).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "24"
  # Plain static output in .output/public (Nitro would otherwise pick its Netlify preset on Netlify).
  NITRO_PRESET = "static"
  NUXT_PUBLIC_API_BASE = "https://injaz-api.jab-eri.org"

# Every app route (/b/…, /w/…, /invite/…) loads the SPA, which then routes on the client. Real files win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Caching: Netlify's default (revalidate with ETags) on purpose. /_nuxt/ also holds builds/latest.json, which
# changes with every deploy, so it must not be marked immutable like the hashed JS/CSS next to it.
