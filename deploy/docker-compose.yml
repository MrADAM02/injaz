# Production stack for the server: copy to /opt/injaz/docker-compose.yml next to a .env (see .env.example).
# The server is shared with other live projects, so this stack:
#   - publishes the API on 127.0.0.1:5003 only (the host nginx proxies injaz-api.jab-eri.org to it),
#   - never publishes PostgreSQL (reachable only inside the "injaz" network, by the name "postgres"),
#   - has hard memory/CPU limits and rotated logs, so it can't starve the other projects or fill the disk.
name: injaz

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Sized for the memory limit below (the defaults assume a dedicated machine).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: injaz
      POSTGRES_USER: injaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U injaz -d injaz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    networks: [injaz]

  api:
    image: ghcr.io/mradam02/injaz-api:${API_VERSION:?API_VERSION must be set}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production # also applies migrations at startup (appsettings.Production.json)
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=injaz;Username=injaz;Password=${POSTGRES_PASSWORD};Maximum Pool Size=20
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set}
      Invitations__FrontendBaseUrl: ${FRONTEND_ORIGIN}
      # Workstation GC: a much smaller memory footprint than the server GC on a small, shared machine.
      DOTNET_gcServer: "0"
    ports:
      - "127.0.0.1:5003:8080"
    mem_limit: 384m
    cpus: 1.0
    logging: *logging
    networks: [injaz]

networks:
  injaz:

volumes:
  postgres-data:
