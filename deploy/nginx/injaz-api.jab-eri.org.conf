# /etc/nginx/sites-available/injaz-api.jab-eri.org.conf  (symlinked into sites-enabled)
#
# HTTP only on purpose: `sudo certbot --nginx -d injaz-api.jab-eri.org` then adds the 443/TLS parts and the
# HTTP→HTTPS redirect, exactly like the other sites on this server. Everything here is scoped to this
# server_name, so it can't change how the other sites behave. Always run `sudo nginx -t` before reloading.

server {
    listen 80;
    listen [::]:80;
    server_name injaz-api.jab-eri.org;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The API takes JSON only (the largest body is a 20,000-character description).
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json application/problem+json;
    gzip_min_length 1000;

    # Live board updates (SignalR). WebSockets need the upgrade headers and long-lived connections; the
    # client pings every 15 s. No access log here: the browser passes its access token in the query string.
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering    off;
        access_log         off;
    }

    location / {
        proxy_pass            http://127.0.0.1:5003;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
