name: Backend

# Pull requests: build + test. Pushes to main: also publish the API image to GHCR and, once the repository
# variable DEPLOY_ENABLED is "true", deploy it to the server (like TrainingPlatform).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mradam02/injaz-api

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      # Handler and API tests start a real PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test
        working-directory: backend
        run: dotnet test --no-build --configuration Release

  publish:
    name: Publish image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new image and restart the API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/injaz
            export API_VERSION=sha-${{ github.sha }}
            docker compose pull api
            docker compose up -d --remove-orphans
            # Only Injaz's own old images: the server runs other projects.
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/MrADAM02/injaz"

      - name: Health check
        run: |
          for attempt in $(seq 1 12); do
            if curl -sf https://injaz-api.jab-eri.org/health > /dev/null; then
              echo "Healthy"
              exit 0
            fi
            sleep 5
          done
          echo "The API did not become healthy within a minute" >&2
          exit 1
